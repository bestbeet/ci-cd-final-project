apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Delete workspace contents before cloning source.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.19
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace"
        find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "Workspace cleaned"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  description: Run ESLint over Node.js source code and tests.
  workspaces:
    - name: source
  steps:
    - name: lint-with-eslint
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm run lint

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  description: Run Node.js unit tests using Jest.
  workspaces:
    - name: source
  steps:
    - name: run-jest-tests
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm test -- --runInBand
